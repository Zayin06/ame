name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build unsigned artifacts without signing or notarization
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# ide/ is the checkout root. Runtime paths refer to trusted files provisioned
# on the runner; alternatively provide an HTTPS raw executable plus its pinned
# SHA-256. Each runtime must be OpenCode 2.3.2 for the indicated architecture.
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            targets: nsis portable
            runtime_path: AME_OPENCODE_CLI_WIN32_X64
            runtime_url: AME_OPENCODE_URL_WIN32_X64
            runtime_sha: AME_OPENCODE_SHA256_WIN32_X64
            archive_url: https://github.com/anomalyco/opencode/releases/download/v2.3.2/opencode-windows-x64.zip
            archive_sha: 8ad59f1992a0594d8bd72b5ed3be1f5bfffcd9d1756853eec7e5d3141c25be1f
          - os: macos-latest
            platform: mac
            arch: x64
            targets: dmg zip
            runtime_path: AME_OPENCODE_CLI_DARWIN_X64
            runtime_url: AME_OPENCODE_URL_DARWIN_X64
            runtime_sha: AME_OPENCODE_SHA256_DARWIN_X64
            archive_url: https://github.com/anomalyco/opencode/releases/download/v2.3.2/opencode-darwin-x64-baseline.zip
            archive_sha: 6dc5deb4554df035d27dbb3a4663d96954969a33079aeb6b01dd9de2d9092545
          - os: macos-latest
            platform: mac
            arch: arm64
            targets: dmg zip
            runtime_path: AME_OPENCODE_CLI_DARWIN_ARM64
            runtime_url: AME_OPENCODE_URL_DARWIN_ARM64
            runtime_sha: AME_OPENCODE_SHA256_DARWIN_ARM64
            archive_url: https://github.com/anomalyco/opencode/releases/download/v2.3.2/opencode-darwin-arm64.zip
            archive_sha: 31ab5a06a29edc7e49b895f35c2b64ebfe7c7f0437b0f2581b006efcd79fee1a
    runs-on: ${{ matrix.os }}
    env:
      AME_OPENCODE_CLI: ${{ secrets[matrix.runtime_path] || vars[matrix.runtime_path] || secrets.AME_OPENCODE_CLI || vars.AME_OPENCODE_CLI }}
      AME_OPENCODE_URL: ${{ secrets[matrix.runtime_url] || vars[matrix.runtime_url] }}
      AME_OPENCODE_SHA256: ${{ secrets[matrix.runtime_sha] || vars[matrix.runtime_sha] }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable x64 execution on Apple Silicon
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require native target execution for runtime version validation
        shell: bash
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Target Node architecture is required')"
      - run: npm ci
      - run: npm run typecheck
      - name: Provision pinned OpenCode 2.3.2 archive when no custom runtime is configured
        if: env.AME_OPENCODE_CLI == '' && env.AME_OPENCODE_URL == ''
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode-runtime.zip"
          curl -fsSL --retry 3 --max-time 180 "${{ matrix.archive_url }}" -o "$archive"
          actual="$( (sha256sum "$archive" 2>/dev/null || shasum -a 256 "$archive") | awk '{print tolower($1)}' )"
          if [ "$actual" != "${{ matrix.archive_sha }}" ]; then
            echo "Archive SHA-256 mismatch: expected ${{ matrix.archive_sha }}, got $actual" >&2
            exit 1
          fi
          extract_dir="$RUNNER_TEMP/opencode-extracted"
          rm -rf "$extract_dir" && mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"
          bin_name="opencode"
          if [ "${{ matrix.platform }}" = "win" ]; then bin_name="opencode.exe"; fi
          bin_path="$extract_dir/$bin_name"
          if [ ! -f "$bin_path" ]; then
            echo "Expected runtime binary not found at $bin_path" >&2
            exit 1
          fi
          if [ "${{ matrix.platform }}" != "win" ]; then chmod 0755 "$bin_path"; fi
          echo "AME_OPENCODE_CLI=$bin_path" >> "$GITHUB_ENV"
          echo "AME_OPENCODE_SHA256=$( (sha256sum "$bin_path" 2>/dev/null || shasum -a 256 "$bin_path") | awk '{print tolower($1)}' )" >> "$GITHUB_ENV"
      - name: Acquire pinned runtime if no trusted local path is configured
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { appendFile, chmod, writeFile } from 'node:fs/promises'
          import path from 'node:path'
          if (!process.env.AME_OPENCODE_CLI) {
            const url = new URL(process.env.AME_OPENCODE_URL || 'https://invalid.invalid')
            const expected = process.env.AME_OPENCODE_SHA256 || ''
            if (url.protocol !== 'https:' || !/^[a-f\d]{64}$/i.test(expected)) throw new Error('Trusted runtime path or HTTPS URL and pinned SHA-256 required')
            const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(120000) })
            if (!response.ok) throw new Error(`Runtime download failed: ${response.status}`)
            const bytes = Buffer.from(await response.arrayBuffer())
            if (createHash('sha256').update(bytes).digest('hex') !== expected.toLowerCase()) throw new Error('Runtime SHA-256 mismatch')
            const file = path.join(process.env.RUNNER_TEMP, process.platform === 'win32' ? 'opencode.exe' : 'opencode')
            await writeFile(file, bytes)
            if (process.platform !== 'win32') await chmod(file, 0o755)
            await appendFile(process.env.GITHUB_ENV, `AME_OPENCODE_CLI=${file}\n`)
          }
          NODE
      - name: Stage and verify exact OpenCode 2.3.2 for target architecture
        run: npm run runtime:prepare
      - name: Build backend plugin before real runtime tests
        run: npm run build:server
      - name: Test with required real backend coverage
        env:
          AME_REQUIRE_BACKEND_TESTS: '1'
        run: npm test
      # Node-based tests must finish before switching node-pty to Electron's ABI.
      - name: Rebuild node-pty for target Electron architecture
        run: npx electron-builder install-app-deps --arch=${{ matrix.arch }}
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Require signing secrets for tag releases
        if: github.event_name == 'push' && inputs.dry_run != true
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ '${{ matrix.platform }}' = win ]; then
            : "${CSC_LINK:?CSC_LINK is required for Windows tag releases}"
          else
            : "${APPLE_ID:?APPLE_ID is required for macOS tag releases}"
            : "${APPLE_APP_SPECIFIC_PASSWORD:?APPLE_APP_SPECIFIC_PASSWORD is required for macOS tag releases}"
            : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required for macOS tag releases}"
          fi
      - name: Package platform artifacts without publishing
        shell: bash
        env:
          CSC_LINK: ${{ inputs.dry_run != true && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.dry_run != true && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.dry_run != true && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.dry_run != true && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.dry_run != true && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ '${{ matrix.platform }}' = win ]; then
            node scripts/build-win-release.mjs --targets ${{ matrix.targets }}
          else
            npx electron-builder --${{ matrix.platform }} ${{ matrix.targets }} --${{ matrix.arch }} --publish never
          fi
      - name: Smoke test packaged Windows app
        if: matrix.platform == 'win'
        run: node scripts/smoke-packaged.mjs
      - name: Generate packaged artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          files=(*.exe *.dmg *.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No packaged artifacts found for checksums' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            sha256sum "$file" 2>/dev/null || shasum -a 256 "$file"
          done > "SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ame-ide-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS-${{ matrix.platform }}-${{ matrix.arch }}.txt
  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ame-ide-*
          path: artifacts
      - name: Publish verified tag release with artifacts and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No release artifacts downloaded' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${files[@]}"
