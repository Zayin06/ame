name: Build macOS
on:
  push:
    tags: ['mac-*']
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run full unit test suite before packaging
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-mac:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: arm64
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify Node architecture
        shell: bash
        run: node -e "if (process.arch !== 'arm64') throw new Error('Target Node architecture is required')"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Download and verify pinned OpenCode 2.3.2 macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode-runtime.zip"
          archive_sha="31ab5a06a29edc7e49b895f35c2b64ebfe7c7f0437b0f2581b006efcd79fee1a"
          curl -fsSL --retry 3 --max-time 180 "https://github.com/anomalyco/opencode/releases/download/v2.3.2/opencode-darwin-arm64.zip" -o "$archive"
          actual="$(shasum -a 256 "$archive" | awk '{print tolower($1)}')"
          if [ "$actual" != "$archive_sha" ]; then
            echo "Archive SHA-256 mismatch: expected $archive_sha, got $actual" >&2
            exit 1
          fi
          extract_dir="$RUNNER_TEMP/opencode-extracted"
          rm -rf "$extract_dir" && mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"
          chmod 0755 "$extract_dir/opencode"
          echo "AME_OPENCODE_CLI=$extract_dir/opencode" >> "$GITHUB_ENV"
          echo "AME_OPENCODE_SHA256=$(shasum -a 256 "$extract_dir/opencode" | awk '{print tolower($1)}')" >> "$GITHUB_ENV"
      - name: Stage and verify OpenCode 2.3.2 macOS runtime
        run: npm run runtime:prepare
      - name: Build backend plugin before tests
        run: npm run build:server
      - name: Unit tests
        if: ${{ inputs.run_tests == true }}
        timeout-minutes: 15
        env:
          AME_REQUIRE_BACKEND_TESTS: '1'
        run: npm test
      - name: Rebuild native modules for Electron target architecture
        run: npx electron-builder install-app-deps --arch=arm64
      - name: Build server plugin and Electron app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx electron-vite build
      - name: Package macOS DMG only
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx electron-builder --mac dmg --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ame-ide-mac-arm64-${{ github.run_id }}
          if-no-files-found: error
          compression-level: 0
          path: release/*.dmg
